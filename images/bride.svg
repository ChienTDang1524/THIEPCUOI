      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="50%" stop-color="#fed7d7"/>
      <stop offset="100%" stop-color="#feb2b2"/>
    </linearGradient>
    <linearGradient id="goldBride" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7c975"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#9e7516"/>

    <path d="M-8 8 C-4 2 4 2 8 8 C4 14 -4 14 -8 8 Z" fill="#e53e3e"/>
  </g>
  
  <text x="250" y="320" font-family="'Playfair Display', serif" font-size="22" font-weight="bold" fill="#721c24" text-anchor="middle">ẢNH CÔ DÂU</text>
  <text x="250" y="350" font-family="'Montserrat', sans-serif" font-size="13" fill="#9b2c2c" text-anchor="middle">Đặt file 'bride.jpg' vào thư mục images/</text>
